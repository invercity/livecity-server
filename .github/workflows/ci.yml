name: CI — Audit, Build & Test

on:
  push:
    branches: [master, main, 'feat/**']
  pull_request:
    branches: [master, main]

jobs:
  audit-build-test:
    name: Dependency Audit, Build & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (built-in node:test)
        run: npm test

      - name: Build all workspaces (API & Web)
        run: npm run build
